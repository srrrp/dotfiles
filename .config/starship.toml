command_timeout = 2000

format = '${custom.dir_home}${custom.dir_other}$all'

[buf]
disabled = true

[character]
error_symbol = "[●](bold red)"
success_symbol = "[●](bold green)"

[directory]
disabled = true

[custom.dir_home]
when = '[ "$PWD" = "$HOME" ]'
command = "echo '[home]'"
format = '[$output]($style) '
style = "bold cyan"

[custom.dir_other]
when = '[ "$PWD" != "$HOME" ]'
command = 'echo "$PWD" | sed "s|^$HOME|~|"'
format = '[$output]($style) '
style = "bold cyan"

[git_branch]
symbol = " "
truncation_length = 18

[package]
disabled = true
